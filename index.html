<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap');
        body { margin: 0; background: #000; color: #fff; font-family: 'Syncopate', sans-serif; overflow: hidden; }
        #canvas-container { position: fixed; top: 0; left: 0; z-index: 1; }
        
        #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 50px; border: 1px solid rgba(139, 92, 246, 0.2); margin: 20px; box-sizing: border-box; }
        .glitch-text { font-size: 0.8rem; letter-spacing: 0.5rem; color: #8b5cf6; text-shadow: 0 0 10px #8b5cf6; }
        .video-meta { transform: rotate(-90deg); transform-origin: left bottom; position: absolute; bottom: 100px; left: 70px; font-size: 0.7rem; color: #aaa; }
        
        #start-overlay { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.5s; }
        .pulse { animation: pulse-red 2s infinite; font-size: 1.5rem; letter-spacing: 1rem; text-align: center; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.98); } }
        .progress-bar { position: absolute; bottom: 0; left: 0; height: 2px; background: #8b5cf6; width: 0%; transition: width 0.1s linear; box-shadow: 0 0 15px #8b5cf6; }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="startBroadcast()">
        <div class="pulse">INITIATE_ALGORITHM<br><span style="font-size: 0.6rem; letter-spacing: 0.2rem; color: #666;">SYNC AUDIO CHANNEL</span></div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui">
        <div class="glitch-text">SM0K367 // ABSOLUTE_BROADCAST_v2.6</div>
        <div class="video-meta" id="video-name">CONNECTING...</div>
        <div class="progress-bar" id="progress"></div>
    </div>

    <script>
        const videoSources = [
            "Glowing AI Eye Animation.mp4",
            "epic-tech-ai-walkthrough.mp4",
            "010b4bba-04a1-4af1-b4e1-bffff297dd38.mp4",
            "035f11fd-533f-4983-a9fa-5c9dff3bb162.mp4",
            "200d7d0e-648f-4de0-aa39-c9d88ee67ca9.mp4",
            "2f42c750-6441-4a5f-9f3f-d78c759752a1 (1).mp4",
            "38fce049-003f-4e77-b978-097d4bc07cb0.mp4",
            "7713a62d-213b-4f93-83f7-29f238412b92.mp4",
            "8233b596-18c8-48a3-8ff8-1c9bcd213412 (1).mp4",
            "e1a240c9-59c9-4e4e-8e63-536aa069852c.mp4",
            "e5fa84cd-003d-4901-b4a2-4a0ada2fe658.mp4",
            "fb18a000-8086-4c7a-816a-0ad0bcd650b0 (1).mp4"
        ];

        let scene, camera, renderer, currentVideoIndex = 0;
        let videoElement, videoTexture, videoMesh;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 8000;
            const posArray = new Float32Array(starsCount * 3);
            for(let i=0; i<starsCount*3; i++) posArray[i] = (Math.random() - 0.5) * 25;
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starsMaterial = new THREE.PointsMaterial({ size: 0.005, color: 0x8b5cf6, transparent: true, opacity: 0.4 });
            scene.add(new THREE.Points(starsGeometry, starsMaterial));

            camera.position.z = 10;
            animate();
        }

        function startBroadcast() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('start-overlay').remove(), 500);
            playVideo(0);
        }

        function playVideo(index) {
            currentVideoIndex = index;
            const source = videoSources[index];
            document.getElementById('video-name').innerText = "SOURCE: " + source.toUpperCase();

            if (!videoElement) {
                videoElement = document.createElement('video');
                videoElement.crossOrigin = "anonymous";
                videoElement.onended = () => nextVideo();
            }

            videoElement.src = source;
            videoElement.load();
            videoElement.play();
            videoElement.muted = false;

            if (!videoTexture) {
                videoTexture = new THREE.VideoTexture(videoElement);
                const geometry = new THREE.PlaneGeometry(16, 9);
                const material = new THREE.MeshBasicMaterial({ map: videoTexture, transparent: true });
                videoMesh = new THREE.Mesh(geometry, material);
                scene.add(videoMesh);
            }

            gsap.fromTo(camera.position, { z: 20, y: 10 }, { z: 8, y: 0, duration: 3, ease: "expo.out" });
            gsap.fromTo(videoMesh.material, { opacity: 0 }, { opacity: 1, duration: 1.5 });
        }

        function nextVideo() {
            let nextIndex = (currentVideoIndex + 1) % videoSources.length;
            gsap.to(camera.position, { z: 0, duration: 1.2, ease: "power4.in", onComplete: () => {
                playVideo(nextIndex);
            }});
        }

        function animate() {
            requestAnimationFrame(animate);
            if (videoElement && !isNaN(videoElement.duration)) {
                const progress = (videoElement.currentTime / videoElement.duration) * 100;
                document.getElementById('progress').style.width = progress + "%";
            }
            if (videoMesh) {
                videoMesh.rotation.y = Math.sin(Date.now() * 0.0005) * 0.03;
                videoMesh.rotation.x = Math.cos(Date.now() * 0.0005) * 0.02;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
