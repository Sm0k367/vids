<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic Tech AI</title>
  <meta property="og:image" content="banner2.png">
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #010014; overflow: hidden; font-family: 'Syncopate', Arial, sans-serif; }
    #start-btn { position: fixed; inset: 0; background: #000c2a; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; font-size: 2.3rem; letter-spacing: 1rem; transition: opacity 0.6s; color: #fff; font-weight: 700;}
    #start-btn .sub { margin-top: 22px; color: #8b5cf6; font-size: 0.8rem; letter-spacing: 0.3rem;}
    .cyber-bar {
      position: absolute; top: 22px; right: 40px; z-index: 5;
      text-align: right; color: #b8e7ff; font-size: 1.12rem;
      background: rgba(15,0,44,0.8); border-radius: 14px; padding: 15px 24px 10px 24px;
      user-select: none; pointer-events: none;
      box-shadow: 0 0 16px #4bcaff99;
      font-family: inherit;
      letter-spacing: 0.09em;
      opacity: .97;
      min-width: 270px;
    }
    .cyber-bar .brand { font-size: 1.18em; color: #18ffff; letter-spacing: 0.13em; font-weight: bold; text-shadow: 0 0 14px #1fd0e066;}
    .cyber-bar .sub { color: #79d6e6; font-size: 0.93em;}
    .cyber-bar .handle {
      color: #fff; font-size: 1.02em; margin-top: 10px; font-weight: 700;
      text-shadow: 0 0 8px #8b5cf6dd;
    }
    @media (max-width:700px) {
      .cyber-bar { position: static; padding: 11px 7px 7px 7px; margin: 10px 0; right: 0; left: 0; border-radius: 0;}
    }
  </style>
</head>
<body>
<div id="start-btn" onclick="initApp()">
  <span style="font-size: 2.6rem; letter-spacing: .12em; color: #18ffff; text-shadow: 0 0 22px #1fd0e0;">
    EPIC TECH AI
  </span>
  <div class="sub">SM0K367 NEURAL SINGULARITY<br>OVERRIDING_CORS_PROTOCOLS</div>
</div>
<div class="cyber-bar" id="cyber-bar" style="display:none">
  <div class="brand">Epic Tech AI</div>
  <div class="sub">Neural Singularity Visual Gallery</div>
  <div class="handle">X.com/@Smoken420</div>
</div>
<script>
const VIDEO_LIST = [
  { title: "010b4bba-04a1-4af1-b4e1-bffff297dd38", file: "010b4bba-04a1-4af1-b4e1-bffff297dd38.mp4" },
  { title: "035f11fd-533f-4983-a9fa-5c9dff3bb162", file: "035f11fd-533f-4983-a9fa-5c9dff3bb162.mp4" },
  { title: "1c2585b5-48b9-483f-80c6-c329f2bca2d0", file: "1c2585b5-48b9-483f-80c6-c329f2bca2d0.mp4" },
  { title: "200d7d0e-648f-4de0-aa39-c9d88ee67ca9", file: "200d7d0e-648f-4de0-aa39-c9d88ee67ca9.mp4" },
  { title: "25c87a1d-2ab4-4657-9de2-179d985cef30", file: "25c87a1d-2ab4-4657-9de2-179d985cef30.mp4" },
  { title: "2f42c750-6441-4a5f-9f3f-d78c759752a1 (1)", file: "2f42c750-6441-4a5f-9f3f-d78c759752a1 (1).mp4" },
  { title: "38fce049-003f-4e77-b978-097d4bc07cb0", file: "38fce049-003f-4e77-b978-097d4bc07cb0.mp4" },
  { title: "67251617-e010-45e5-befc-07598b6aadbd", file: "67251617-e010-45e5-befc-07598b6aadbd.mp4" },
  { title: "7713a62d-213b-4f93-83f7-29f238412b92", file: "7713a62d-213b-4f93-83f7-29f238412b92.mp4" },
  { title: "8233b596-18c8-48a3-8ff8-1c9bcd213412 (1)", file: "8233b596-18c8-48a3-8ff8-1c9bcd213412 (1).mp4" },
  { title: "Glowing AI Eye Animation", file: "Glowing AI Eye Animation.mp4" },
  { title: "e1a240c9-59c9-4e4e-8e63-536aa069852c", file: "e1a240c9-59c9-4e4e-8e63-536aa069852c.mp4" },
  { title: "e5fa84cd-003d-4901-b4a2-4a0ada2fe658", file: "e5fa84cd-003d-4901-b4a2-4a0ada2fe658.mp4" },
  { title: "epic-tech-ai-walkthrough", file: "epic-tech-ai-walkthrough.mp4" },
  { title: "fb18a000-8086-4c7a-816a-0ad0bcd650b0 (1)", file: "fb18a000-8086-4c7a-816a-0ad0bcd650b0 (1).mp4" },
  { title: "6be50863-e136-481c-9542-40f7e0ba7259", file: "6be50863-e136-481c-9542-40f7e0ba7259.mp4" }
];
let currentIdx = 0, videoEl, videoTexture, videoMesh, stars, scene, camera, renderer;
let theme = 0;

function initApp() {
  gsap.to("#start-btn", { opacity: 0, duration: 0.7, onComplete:()=>document.getElementById('start-btn').remove() });
  document.getElementById('cyber-bar').style.display = "";
  setTimeout(()=>{setupThreeJS(); playVideoAt(currentIdx); animate();},250);
  window.addEventListener('resize', onResize);
}

function setupThreeJS() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, .1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  stars = makeStars();
  scene.add(stars);
}

function onResize(){
  if(!camera||!renderer)return;
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

function makeStars() {
  const starGeo = new THREE.BufferGeometry();
  let starCoords = [];
  for(let i=0;i<9000;i++) starCoords.push((Math.random()-0.5)*155, (Math.random()-0.5)*95, (Math.random()-0.5)*175);
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords,3));
  return new THREE.Points(starGeo, new THREE.PointsMaterial({color: [0x18ffff,0x41ecec,0x982fff][theme], size: 0.07}));
}

function playVideoAt(idx) {
  currentIdx = idx;
  if(videoEl) { videoEl.pause(); videoEl.removeAttribute('src'); videoEl.load(); }
  videoEl = document.createElement('video');
  videoEl.src = VIDEO_LIST[idx].file;
  videoEl.crossOrigin = "anonymous";
  videoEl.playsInline = true;
  videoEl.preload = "auto";
  videoEl.muted = false;
  videoEl.loop = false;
  videoEl.style.display = "none";
  document.body.appendChild(videoEl);
  videoEl.onended = nextVideo;
  videoEl.oncanplay = ()=>{ videoEl.play(); };
  videoTexture = new THREE.VideoTexture(videoEl);
  videoTexture.minFilter = THREE.LinearFilter;
  videoTexture.magFilter = THREE.LinearFilter;
  if(videoMesh) scene.remove(videoMesh);
  const geom = new THREE.PlaneGeometry(16,9);
  const mat = new THREE.MeshBasicMaterial({ map: videoTexture });
  videoMesh = new THREE.Mesh(geom, mat);
  videoMesh.position.z = 0;
  videoMesh.scale.set(.99,.99,1);
  scene.add(videoMesh);
  camera.position.set(0,0,12);
  if(stars)scene.remove(stars); stars = makeStars(); scene.add(stars);
  gsap.to(camera.position, { z: 9+Math.random()*1.5, duration: 2.2, ease:"power3.out" });
  gsap.fromTo(videoMesh.scale, {x:1.08,y:1.08}, {x:.99,y:.99,duration:2.5,ease:"power2.out"});
}

function nextVideo() {
  let idx = (currentIdx + 1) % VIDEO_LIST.length;
  playVideoAt(idx);
}

function animate() {
  requestAnimationFrame(animate);
  if(stars) stars.rotation.y += 0.00032+0.0002*theme;
  if(videoMesh) videoMesh.rotation.y = Math.sin(Date.now() * .00036+.23) * .13;
  renderer.render(scene, camera);
}

// Optional: Keyboard navigation for you
window.addEventListener('keydown', e=>{
  if(!scene) return;
  if(e.key==='ArrowRight') nextVideo();
  if(e.key==='ArrowLeft') {
    let idx = (currentIdx - 1 + VIDEO_LIST.length) % VIDEO_LIST.length;
    playVideoAt(idx);
  }
  if(e.key==='t' || e.key==='T') { // Change theme
    theme = (theme+1)%3;
    if(stars) {scene.remove(stars); stars = makeStars(); scene.add(stars);}
    document.body.style.backgroundColor = ["#010014","#0a3141","#100017"][theme];
  }
});
</script>
</body>
</html>
