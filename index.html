<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic Tech AI — Lounge After Dark</title>
  <meta property="og:image" content="banner2.png">
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #010014; overflow: hidden; font-family: 'Syncopate', Arial, sans-serif; }
    #start-btn { position: fixed; inset: 0; background: #000c2a; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; font-size: 2.3rem; letter-spacing: 1rem; transition: opacity 0.6s; color: #fff; font-weight: 700;}
    #start-btn .sub { margin-top: 22px; color: #8b5cf6; font-size: 0.8rem; letter-spacing: 0.3rem;}
    .cyber-bar {
      position: absolute; top: 22px; right: 40px; z-index: 5;
      text-align: right; color: #b8e7ff; font-size: 1.12rem;
      background: rgba(15,0,44,0.8); border-radius: 14px; padding: 15px 24px 10px 24px;
      user-select: none; pointer-events: none;
      box-shadow: 0 0 16px #4bcaff99;
      font-family: inherit;
      letter-spacing: 0.09em;
      opacity: .97;
      min-width: 270px;
      pointer-events: none;
    }
    .cyber-bar .brand { font-size: 1.18em; color: #18ffff; letter-spacing: 0.13em; font-weight: bold; text-shadow: 0 0 14px #1fd0e066;}
    .cyber-bar .sub { color: #79d6e6; font-size: 0.93em;}
    .cyber-bar .handle { color: #fff; font-size: 1.02em; font-weight: 700; margin-top: 10px; text-shadow: 0 0 8px #8b5cf6cc;}
    .cyber-bar .mini { color: #ffbff8; font-size: 0.77em; margin-top: 5px; }
    #upload-btn {
      position: fixed; bottom: 32px; right: 32px; z-index: 12;
      background: #121333; color: #18ffff;
      font-size: 2.2rem; border: none; border-radius: 50%; width: 60px; height: 60px;
      cursor: pointer; box-shadow: 0 2px 18px #36206f80; transition: background 0.13s, box-shadow 0.18s;
      opacity: 0.93;
    }
    #upload-btn:hover { background: #262775; box-shadow: 0 6px 28px #18ffff70; }
    #fileinput { display: none; }
    @media (max-width:700px) {
      .cyber-bar { position: static; padding: 11px 7px 7px 7px; margin: 10px 0; right: 0; left: 0; border-radius: 0;}
      #upload-btn { bottom: 19px; right: 14px; width: 46px; height: 46px; font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div id="start-btn" onclick="initApp()">
  <span style="font-size: 2.6rem; letter-spacing: .12em; color: #18ffff; text-shadow: 0 0 22px #1fd0e0;">
    EPIC TECH AI — BLACK MARKET LOUNGE
  </span>
  <div class="sub">After Dark Edition<br>Webcam+Upload+GlitchFX</div>
</div>
<div class="cyber-bar" id="cyber-bar" style="display:none">
  <div class="brand">Epic Tech AI</div>
  <div class="sub">Neural Singularity Visual Gallery</div>
  <div class="handle">X.com/@Smoken420</div>
  <div class="mini">[E: effect, W: webcam, ⬆: upload, ←/→: nav]</div>
</div>
<button id="upload-btn" title="Upload your own video">➕</button>
<input type="file" id="fileinput" accept="video/mp4,video/webm">
<script>
const VIDEO_LIST = [
  { title: "010b4bba-04a1-4af1-b4e1-bffff297dd38", file: "010b4bba-04a1-4af1-b4e1-bffff297dd38.mp4" },
  { title: "035f11fd-533f-4983-a9fa-5c9dff3bb162", file: "035f11fd-533f-4983-a9fa-5c9dff3bb162.mp4" },
  { title: "1c2585b5-48b9-483f-80c6-c329f2bca2d0", file: "1c2585b5-48b9-483f-80c6-c329f2bca2d0.mp4" },
  { title: "200d7d0e-648f-4de0-aa39-c9d88ee67ca9", file: "200d7d0e-648f-4de0-aa39-c9d88ee67ca9.mp4" },
  { title: "25c87a1d-2ab4-4657-9de2-179d985cef30", file: "25c87a1d-2ab4-4657-9de2-179d985cef30.mp4" },
  { title: "2f42c750-6441-4a5f-9f3f-d78c759752a1 (1)", file: "2f42c750-6441-4a5f-9f3f-d78c759752a1 (1).mp4" },
  { title: "38fce049-003f-4e77-b978-097d4bc07cb0", file: "38fce049-003f-4e77-b978-097d4bc07cb0.mp4" },
  { title: "67251617-e010-45e5-befc-07598b6aadbd", file: "67251617-e010-45e5-befc-07598b6aadbd.mp4" },
  { title: "7713a62d-213b-4f93-83f7-29f238412b92", file: "7713a62d-213b-4f93-83f7-29f238412b92.mp4" },
  { title: "8233b596-18c8-48a3-8ff8-1c9bcd213412 (1)", file: "8233b596-18c8-48a3-8ff8-1c9bcd213412 (1).mp4" },
  { title: "Glowing AI Eye Animation", file: "Glowing AI Eye Animation.mp4" },
  { title: "e1a240c9-59c9-4e4e-8e63-536aa069852c", file: "e1a240c9-59c9-4e4e-8e63-536aa069852c.mp4" },
  { title: "e5fa84cd-003d-4901-b4a2-4a0ada2fe658", file: "e5fa84cd-003d-4901-b4a2-4a0ada2fe658.mp4" },
  { title: "epic-tech-ai-walkthrough", file: "epic-tech-ai-walkthrough.mp4" },
  { title: "fb18a000-8086-4c7a-816a-0ad0bcd650b0 (1)", file: "fb18a000-8086-4c7a-816a-0ad0bcd650b0 (1).mp4" },
  { title: "6be50863-e136-481c-9542-40f7e0ba7259", file: "6be50863-e136-481c-9542-40f7e0ba7259.mp4" }
];

let currentIdx = 0, videoEl, videoTexture, videoMesh, stars, scene, camera, renderer, webcamStream, webcamTexture, webcamMesh;
let theme = 0, effectMode = 0, webcamOn = false;

// --- THREE.js / Main Gallery Logic ---
function initApp() {
  gsap.to("#start-btn", { opacity: 0, duration: 0.7, onComplete:()=>document.getElementById('start-btn').remove() });
  document.getElementById('cyber-bar').style.display = "";
  setTimeout(()=>{setupThreeJS(); playVideoAt(currentIdx); animate();},250);
  window.addEventListener('resize', onResize);
}

function setupThreeJS() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, .1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  stars = makeStars();
  scene.add(stars);
}

// Video gallery logic
function playVideoAt(idx) {
  currentIdx = idx;
  if(videoEl) { videoEl.pause(); videoEl.removeAttribute('src'); videoEl.load(); }
  videoEl = document.createElement('video');
  videoEl.src = VIDEO_LIST[idx].file;
  videoEl.crossOrigin = "anonymous";
  videoEl.playsInline = true;
  videoEl.preload = "auto";
  videoEl.muted = false;
  videoEl.loop = false;
  videoEl.style.display = "none";
  document.body.appendChild(videoEl);
  videoEl.onended = nextVideo;
  videoEl.oncanplay = ()=>{ videoEl.play(); };
  videoTexture = new THREE.VideoTexture(videoEl);
  videoTexture.minFilter = THREE.LinearFilter;
  videoTexture.magFilter = THREE.LinearFilter;
  if(videoMesh) scene.remove(videoMesh);
  const geom = new THREE.PlaneGeometry(16,9);
  let mat = createMaterial();
  videoMesh = new THREE.Mesh(geom, mat);
  videoMesh.position.z = 0;
  videoMesh.scale.set(.99,.99,1);
  scene.add(videoMesh);
  camera.position.set(0,0,12);
  if(stars)scene.remove(stars); stars = makeStars(); scene.add(stars);
  gsap.to(camera.position, { z: 9+Math.random()*1.5, duration: 2.1, ease:"power3.out" });
  gsap.fromTo(videoMesh.scale, {x:1.08,y:1.08}, {x:.99,y:.99,duration:2.1,ease:"power2.out"});
  if(webcamMesh && scene) scene.add(webcamMesh); // Ensure webcam stays in front
}
function nextVideo() { let idx = (currentIdx + 1) % VIDEO_LIST.length; playVideoAt(idx); }
function onResize(){
  if(!camera||!renderer)return;
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

// --- Stars ---
function makeStars() {
  const starGeo = new THREE.BufferGeometry();
  let starCoords = [];
  for(let i=0;i<9000;i++) starCoords.push((Math.random()-0.5)*155, (Math.random()-0.5)*95, (Math.random()-0.5)*175);
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords,3));
  return new THREE.Points(starGeo, new THREE.PointsMaterial({color: [0x18ffff,0x41ecec,0x982fff][theme], size: 0.07}));
}

// --- Webcam Overlay ---
function toggleWebcam() {
  webcamOn = !webcamOn;
  if(webcamOn) {
    startWebcam();
  } else {
    stopWebcam();
    if (webcamMesh && scene) scene.remove(webcamMesh);
  }
}
function startWebcam() {
  if(webcamMesh && scene) scene.add(webcamMesh);
  if(webcamStream) return;
  navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 } }).then(s=>{
    webcamStream = s;
    let camVideo = document.createElement('video');
    camVideo.srcObject = s;
    camVideo.playsInline = true;
    camVideo.muted = true;
    camVideo.autoplay = true;
    camVideo.style.display='none';
    document.body.appendChild(camVideo);
    camVideo.onloadedmetadata = ()=>{
      camVideo.play();
      webcamTexture = new THREE.VideoTexture(camVideo);
      let mat = new THREE.MeshBasicMaterial({
        map: webcamTexture, transparent: true, opacity: 0.29, side: THREE.DoubleSide
      });
      let mesh = new THREE.Mesh(new THREE.PlaneGeometry(10,5.5), mat);
      mesh.position.set(0,0.5,0.12);
      mesh.renderOrder = 1e9; // Force atop
      webcamMesh = mesh;
      scene.add(mesh);
    };
  }).catch(e=>{alert('Webcam access denied!');webcamOn=false;});
}
function stopWebcam() {
  if (!webcamStream) return;
  webcamStream.getTracks().forEach(track => track.stop());
  webcamStream = null;
  webcamTexture = null;
  if (webcamMesh && scene) scene.remove(webcamMesh);
}

// --- Realtime FX using simple Three.js shaders ---
function createMaterial() {
  if(effectMode===1) { // Simple glitch
    return new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: videoTexture }, time: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);}
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
        void main() {
          vec2 uv = vUv;
          float y = uv.y+0.012*sin(220.0*uv.y+time*4.5);
          float off = 0.02*sin(44.0*uv.y+time*2.0);
          float r = texture2D(tDiffuse, vec2(uv.x+off, y)).r;
          float g = texture2D(tDiffuse, vec2(uv.x, y)).g;
          float b = texture2D(tDiffuse, vec2(uv.x-off, y)).b;
          gl_FragColor = vec4(r,g,b,1.0);
        }
      `
    });
  }
  if(effectMode===2) { // RGB split
    return new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: videoTexture }, time: { value: 0 } },
      vertexShader: `varying vec2 vUv;void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`
        uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
        void main() {
          float amt = 0.018*sin(time*2.5+vUv.y*40.0);
          float off2 = 0.012*cos(time*4.2-vUv.x*15.0);
          float r = texture2D(tDiffuse, vUv+vec2(amt,0)).r;
          float g = texture2D(tDiffuse, vUv+vec2(-amt+off2,0)).g;
          float b = texture2D(tDiffuse, vUv).b;
          gl_FragColor = vec4(r,g,b,1.);
        }
      `
    });
  }
  if(effectMode===3) { // VHS Line
    return new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: videoTexture }, time: { value: 0 } },
      vertexShader: `varying vec2 vUv;void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
        void main() {
          float v = vUv.y + 0.02*sin(time*7. + vUv.y*55.);
          vec4 col = texture2D(tDiffuse, vec2(vUv.x, v));
          float lines = step(0.99, mod(gl_FragCoord.y + time*120.0, 4.0));
          col.rgb -= lines*0.15;
          gl_FragColor = col;
        }
      `
    });
  }
  // No effect
  return new THREE.MeshBasicMaterial({ map: videoTexture });
}

function cycleEffect() {
  effectMode = (effectMode+1)%4;
  if(videoMesh && videoTexture) {
    let parent = videoMesh.parent;
    parent.remove(videoMesh);
    let geom = new THREE.PlaneGeometry(16,9);
    videoMesh = new THREE.Mesh(geom, createMaterial());
    videoMesh.position.z = 0;
    videoMesh.scale.set(.99,.99,1);
    parent.add(videoMesh);
    if(webcamMesh && scene && webcamOn) scene.add(webcamMesh);
  }
}

function animate() {
  requestAnimationFrame(animate);
  if(stars) stars.rotation.y += 0.00032+0.0002*theme;
  if(videoMesh) {
    videoMesh.rotation.y = Math.sin(Date.now() * .00036+.23) * .13;
    // shaderMaterial FX time anim
    if(videoMesh.material.uniforms && videoMesh.material.uniforms.time)
      videoMesh.material.uniforms.time.value = performance.now()*0.001;
  }
  if(webcamMesh && webcamTexture && webcamOn) webcamTexture.needsUpdate = true;
  renderer.render(scene, camera);
}

// --- Upload ---
document.getElementById('upload-btn').onclick = ()=>{ document.getElementById('fileinput').click(); };
document.getElementById('fileinput').onchange = uploadFile;
window.addEventListener('dragover', e=>{e.preventDefault();}, false);
window.addEventListener('drop', function(e){
  e.preventDefault();
  if(e.dataTransfer.files.length) handleNewVideo(e.dataTransfer.files[0]);
}, false);
function uploadFile(e){
  let file = e.target.files[0];
  handleNewVideo(file);
}
function handleNewVideo(file) {
  if(!file || !file.type.startsWith('video/')) return alert("Drop a video file!");
  let url = URL.createObjectURL(file);
  VIDEO_LIST.push({ title: file.name.replace(/\.[^/.]+$/, ""), file: url });
  currentIdx = VIDEO_LIST.length - 1;
  playVideoAt(currentIdx);
}

// --- Hotkeys ---
window.addEventListener('keydown', e=>{
  if(!scene) return;
  if(e.key==='ArrowRight') nextVideo();
  if(e.key==='ArrowLeft') {
    let idx = (currentIdx - 1 + VIDEO_LIST.length) % VIDEO_LIST.length;
    playVideoAt(idx);
  }
  if(e.key==='e' || e.key==='E') cycleEffect();
  if(e.key==='t' || e.key==='T') {
    theme = (theme+1)%3;
    if(stars) {scene.remove(stars); stars = makeStars(); scene.add(stars);}
    document.body.style.backgroundColor = ["#010014","#0a3141","#100017"][theme];
  }
  if(e.key==='w' || e.key==='W') toggleWebcam();
});

</script>
</body>
</html>
