<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM0K367 // NEURAL SINGULARITY</title>
    <meta property="og:image" content="https://raw.githubusercontent.com/Sm0k367/Sm0k367/main/banner2.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap');
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Syncopate', sans-serif; }
        #start-btn { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; }
        .glitch { font-size: 2rem; letter-spacing: 1.5rem; color: #fff; text-transform: uppercase; }
        #data-stream { position: absolute; top: 50px; right: 50px; text-align: right; color: #8b5cf6; font-size: 0.6rem; z-index: 100; }
    </style>
</head>
<body>

    <div id="start-btn" onclick="initCore()">
        <div class="glitch">INITIATE</div>
        <div style="margin-top: 20px; color: #8b5cf6; font-size: 0.7rem; letter-spacing: 0.3rem;">OVERRIDING_CORS_PROTOCOLS</div>
    </div>

    <div id="data-stream">ALGORITHM: SM0K367<br>VIDEO_STATUS: SYNCING...</div>

    <script>
        // List must be exactly as they appear in your 'vids' folder
        const vids = [
            "Glowing AI Eye Animation.mp4",
            "epic-tech-ai-walkthrough.mp4",
            "010b4bba-04a1-4af1-b4e1-bffff297dd38.mp4",
            "035f11fd-533f-4983-a9fa-5c9dff3bb162.mp4",
            "200d7d0e-648f-4de0-aa39-c9d88ee67ca9.mp4",
            "2f42c750-6441-4a5f-9f3f-d78c759752a1 (1).mp4",
            "38fce049-003f-4e77-b978-097d4bc07cb0.mp4",
            "7713a62d-213b-4f93-83f7-29f238412b92.mp4",
            "8233b596-18c8-48a3-8ff8-1c9bcd213412 (1).mp4",
            "e1a240c9-59c9-4e4e-8e63-536aa069852c.mp4",
            "e5fa84cd-003d-4901-b4a2-4a0ada2fe658.mp4",
            "fb18a000-8086-4c7a-816a-0ad0bcd650b0 (1).mp4"
        ];

        let scene, camera, renderer, videoMesh, currentIdx = 0, videoEl, videoTexture;

        function initCore() {
            gsap.to("#start-btn", { opacity: 0, duration: 0.5, onComplete: () => document.getElementById('start-btn').remove() });
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Background Starfield
            const starGeo = new THREE.BufferGeometry();
            const starCoords = [];
            for(let i=0; i<10000; i++) starCoords.push((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100);
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0x8b5cf6, size: 0.05})));

            play(0);
            animate();
        }

        function play(idx) {
            currentIdx = idx;
            
            // CLEAN RE-INIT OF VIDEO ELEMENT
            if(videoEl) {
                videoEl.pause();
                videoEl.removeAttribute('src');
                videoEl.load();
            }

            videoEl = document.createElement('video');
            videoEl.src = vids[idx];
            videoEl.crossOrigin = "anonymous"; // CRITICAL FIX
            videoEl.playsInline = true;
            videoEl.preload = "auto";
            videoEl.onended = () => transition();
            
            videoEl.play().catch(e => {
                console.log("Play blocked, attempting muted fallback", e);
                videoEl.muted = true;
                videoEl.play();
            });

            videoTexture = new THREE.VideoTexture(videoEl);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;

            if(videoMesh) scene.remove(videoMesh);

            const geom = new THREE.PlaneGeometry(16, 9);
            const mat = new THREE.MeshBasicMaterial({ map: videoTexture });
            videoMesh = new THREE.Mesh(geom, mat);
            scene.add(videoMesh);

            camera.position.z = 15;
            gsap.to(camera.position, { z: 10, duration: 2, ease: "power4.out" });
            document.getElementById('data-stream').innerHTML = `FILE: ${vids[idx].substring(0,15)}...<br>AUDIO: ACTIVE`;
        }

        function transition() {
            gsap.to(camera.position, { z: 0, duration: 1, ease: "expo.in", onComplete: () => {
                play((currentIdx + 1) % vids.length);
            }});
        }

        function animate() {
            requestAnimationFrame(animate);
            if(videoMesh) {
                videoMesh.rotation.y = Math.sin(Date.now() * 0.0005) * 0.05;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
